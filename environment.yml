# Conda environment for the language_lm project.
#
#   conda env create -f environment.yml
#   conda activate langlm
#
# Notes for Apple Silicon (the primary development target, an M1/16GB):
#   * PyTorch runs on the `mps` backend. This is the canonical training path
#     (transformers + peft) because Phase 4's vocab-trimming and depth-pruning
#     surgery operates on standard Hugging Face checkpoints.
#   * `mlx` / `mlx-lm` are here for fast local inference, the tokens/sec
#     benchmark, and the Phase 6 export.
#   * `bitsandbytes` is deliberately absent: it has no Apple Silicon build.
#     4-bit quantisation comes from MLX and llama.cpp in Phase 6 instead.
name: langlm
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      # --- modelling -------------------------------------------------------
      - torch
      - transformers
      - tokenizers
      - sentencepiece
      - protobuf
      - accelerate
      - peft
      - trl
      - datasets
      - huggingface-hub
      # --- Apple Silicon inference ----------------------------------------
      - mlx
      - mlx-lm
      # --- grammar tooling -------------------------------------------------
      - language-tool-python
      # ERRANT supplies the alignment machinery and the Edit type; the German
      # merger and classifier are in `langlm.eval.errant_de`. spacy provides the
      # German tags, lemmas and dependencies those rules read, and the model is
      # pinned by URL so that everyone's error types come out the same.
      - errant==3.0.2
      - spacy>=3.8,<4
      - https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl
      # Hunspell in pure Python, for "is this a German word at all?" -- the
      # question that separates a misspelling from a wrong word choice. A flat
      # word list cannot answer it for a language that builds compounds on demand.
      - spylls
      # --- plumbing --------------------------------------------------------
      - requests
      - pyyaml
      - pandas
      - tqdm
      - rich
      - typer
      # --- development -----------------------------------------------------
      - pytest
      - ruff
      - pre-commit
      - -e .
