# Phase 2 configuration: the data pipeline.
#
# Phase 2 builds training data by damaging correct German on purpose and
# labelling the damage. This file decides what counts as correct German to
# start from; the corruptors and the explanation templates get their own
# sections as they land.

# --- clean source text -------------------------------------------------------
clean_corpus:
  # The same Leipzig samples pinned for the tokenizer analysis and the
  # overcorrection set. Published, edited prose, and fixed archives, so the
  # corpus is the same on every machine.
  corpora: [deu_news_2024_100K, deu_wikipedia_2021_100K]
  # Roughly twice the ~30k example target. The surplus is not waste: a
  # corruptor that needs a subordinate clause cannot use a sentence that has
  # none, so the error-type distribution is bought out of headroom.
  size: 60000
  # Shuffle seed. Shares the value used for the overcorrection set and the
  # few-shot prompt, so there is one seed in this project rather than three.
  seed: 20260909

# --- error injection ---------------------------------------------------------
# Derived, not hand-picked: `scripts/derive_injection_weights.py` blends the
# Falko-MERLIN error histogram with the current system's per-type recall and
# writes this block. Regenerate it rather than editing it, and see
# `reports/phase2/injection_weights.md` for the table it came from.
#
# Iteration 3 widens the corruptors from 8 error types to 17. The 8 covered
# 54.3% of dev's gold edits; the model's recall on the types they missed was
# 0.404 against 0.667 on the types they hit, and no serving-side change moved
# that -- see `reports/phase3/ablations.md`. The new rules are pronouns,
# prepositions, auxiliaries, verb and noun morphology, and the two commas German
# does not take where English does.
#
# Nothing is boosted this time. The 2x boost exists for types the model is blind
# to, and against the Phase 1 prompted baseline three types qualified at recall
# 0.04-0.09; the fine-tuned model's weakest injectable type is M:ADP at 0.26, so
# the weights are simply the natural distribution over what the rules can make.
#
# One caveat the table cannot show: `R:OTHER` is 10% here and every bit of it is
# das/dass. The type is broad and the coverage is one confusion pair, so read
# that row as "das/dass" rather than as the type.
injection:
  # How many errors to put in one sentence, sampled inclusively.
  #
  # This was [1, 2] in iteration 1, on the reasoning that most learner sentences
  # carry one or two errors. That was wrong, and measurably so: 39.2% of
  # Falko-MERLIN sentences carry three or more, and a corpus with a hard ceiling
  # of two produced none of them at all. The model never saw a sentence where a
  # third of the words were wrong, which is what an A2 sentence looks like, and
  # its recall showed it.
  #
  # [1, 4] puts the synthetic half's density alongside the real half's instead
  # of dragging the blend down.
  errors_per_sentence: [1, 4]
  weights:
    R:SPELL: 0.1665
    R:DET:FORM: 0.1343
    M:PUNCT: 0.1193
    R:OTHER: 0.0997
    R:ORTH: 0.0962
    R:ADJ:FORM: 0.0570
    R:NOUN:FORM: 0.0493
    U:PUNCT: 0.0445
    R:ADP: 0.0427
    M:DET: 0.0392
    R:WO: 0.0319
    M:PRON: 0.0301
    R:VERB:FORM: 0.0243
    M:AUX: 0.0193
    R:AUX:FORM: 0.0172
    M:ADP: 0.0153
    R:PRON:FORM: 0.0131

# --- LanguageTool, for the rule-id survey -------------------------------------
# Phase 1 has its own `disabled_rules` and this list is deliberately not shared
# with it. Phase 1's numbers are published, and its config is what makes them
# reproducible; editing it now to improve a Phase 2 survey would change the
# provenance of a result that has already been reported.
#
# Nothing is lost by keeping them separate, because the two rules added here
# never affected Phase 1's score anyway. They fire on whitespace-tokenised M2
# text, which puts a space before every full stop -- but Phase 1 re-tokenised
# every system's output before scoring, which normalised those differences away.
# That is visible in the Phase 1 report: the identity baseline shows zero
# spurious edits, and LanguageTool's spurious edits are R:SPELL and R:ORTH with
# no whitespace type among them. The survey counts *matches* rather than applied
# corrections, so here the same rules are pure noise -- 3.7% of everything
# LanguageTool said.
languagetool:
  disabled_rules:
    - WHITESPACE_RULE
    - COMMA_PARENTHESIS_WHITESPACE
    - UNPAIRED_BRACKETS
    # Added for Phase 2: both are complaints about the space that whitespace
    # tokenisation puts before punctuation, not about anything we injected.
    - LEERZEICHEN_NACH_VOR_ANFUEHRUNGSZEICHEN
    - LEERZEICHEN_VOR_AUSRUFEZEICHEN_ETC

# --- the training set --------------------------------------------------------
# Iteration 2. The first recipe was synthetic-only and it made the model worse
# than the untrained baseline on 14 of 15 error types -- spelling recall fell
# from 0.49 to 0.12 on the type it saw most of. See reports/phase3/evaluation.md.
#
# So real learner errors are the primary signal now and the corruptors are the
# supporting one. Falko-MERLIN train has 54 error types, 2.55 edits a sentence,
# and 39% of sentences carrying three or more; the synthetic corpus had 8 types,
# 1.17 edits, and none with three. It also brings its own negatives -- 22.1% of
# its sentences need no correction, which is where that ratio was measured in
# the first place.
#
# The synthetic share stays because it is the only source of rule-level
# explanations: it knows *which* rule it broke, where a Falko edit knows only
# its ERRANT type. Real data teaches what learner German looks like; synthetic
# data teaches how to explain it.
dataset:
  learner:
    # `train` only. Dev is the evaluation set, test is frozen, and
    # `langlm.data.learner` refuses either rather than trusting this field.
    split: train
    limit: null        # null means all 19,237
  synthetic:
    # A minority share. Enough to teach the explanation style, not enough to
    # reimpose the failure mode of iteration 1.
    size: 10000
  # Iteration 5. Clean text damaged by a model rather than by a rule -- trained
  # on Falko-MERLIN train read backwards, so it has learned what a plausible
  # mistake looks like instead of being told. This is the share that is meant to
  # reach the types the corruptors cannot write: `R:OTHER`, lexical choice, is
  # the largest remaining miss at recall 0.32 and no rule will ever produce it.
  #
  # The size is not arbitrary. Luhtaru et al. (2024) measure back-translated
  # error generation on this exact benchmark at +2.4 F0.5 over gold-only for a
  # 7B model -- and 100k generated sentences buy 76.25 of the 76.75 that 1M
  # buys, so 100k is where the curve flattens rather than where the budget ran
  # out. See `reports/phase3/headroom.md`.
  #
  # It needs a clean corpus at least this large: the frozen one is 60,000, and
  # the pool it was drawn from holds about 167,000, so rebuild with
  # `python scripts/build_clean_corpus.py --size 100000` before generating.
  backtranslation:
    size: 100000
    # Defaults to `data/interim/backtranslation/de.kept.jsonl`, which is what
    # `scripts/generate_backtranslation.py` writes after filtering. Absent pairs
    # are not an error -- the corpus builds without them, because training the
    # generator is a separate and much longer step than building a corpus.
    pairs: null
  seed: 20260909
