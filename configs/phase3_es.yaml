# Phase 3 configuration: Spanish supervised fine-tuning.
#
# The Spanish counterpart of `configs/phase3.yaml`. Every hyperparameter below
# is copied from it unchanged -- they are architecture and optimiser choices,
# not language-specific ones, and EuroLLM-1.7B is multilingual by design, so
# there is no reason to expect Spanish to want a different LoRA rank or
# learning rate a priori. What differs is only what has to: the output
# directory, and the training-file/prompt language `train_sft.py --language es`
# selects. If a real training run finds these defaults wrong for Spanish, that
# is itself a Phase 5 finding worth writing up, not something to guess at now.
#
# Runs the same way German does, with the language flag:
#   python scripts/train_sft.py --language es --dry-run
#   python scripts/train_sft.py --language es

model:
  repo_id: utter-project/EuroLLM-1.7B
  dtype: bfloat16

# --- LoRA --------------------------------------------------------------------
lora:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# --- optimisation ------------------------------------------------------------
training:
  epochs: 3
  learning_rate: 1.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  batch_size: 16
  gradient_accumulation: 2
  # Same cap as German's, for the same reason: dropping a long example teaches
  # less damage than truncating one mid-answer. `build_training_set_es.py`'s
  # own report says how many of the COWS-L2H-derived corpus it costs.
  max_length: 1024
  seed: 20260909
  # Held out from the generated corpus, to watch for overfitting during the
  # run. The number that matters is still COWS-L2H dev, real learner Spanish
  # rather than this project's own corruptions -- the same division of labour
  # `validation_size` and Falko-MERLIN dev have for German.
  validation_size: 500
  logging_steps: 25
  # Matched to `save_steps` deliberately. `load_best_model_at_end` resolves the
  # best checkpoint by path -- `checkpoint-<best_global_step>` -- and falls back
  # to the final weights *silently* if that directory was never written
  # (transformers `trainer.py`, `_load_best_model`). Evaluating twice as often
  # as saving therefore buys a finer curve at the risk of the minimum landing on
  # a step with no checkpoint, which is the failure it is here to prevent.
  eval_steps: 500
  save_steps: 500
  # Measured for Spanish now, not carried over: evaluation loss bottoms at
  # epoch ~2 (0.04287) and drifts to 0.04508 by epoch 3 rather than staying
  # flat. `load_best_model_at_end` keeps the best checkpoint whatever the
  # limit would otherwise evict, so six is about retaining the neighbourhood
  # of the minimum for inspection, not about finding it.
  save_total_limit: 6
  # End the run holding the weights with the lowest evaluation loss instead of
  # the last ones. German's config deliberately does not set this: its numbers
  # were all measured on final-step adapters and turning this on would quietly
  # change what `checkpoints/phase3-de` means.
  load_best_model_at_end: true

output:
  # Adapter weights, not a merged model, same reason German's stays separate:
  # Phase 4 does surgery on the base checkpoint and re-applies the adapter.
  adapter_dir: checkpoints/phase3-es
